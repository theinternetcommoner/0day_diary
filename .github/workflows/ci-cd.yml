name: 0day_diary CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies & Run Unit Tests
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Add linters/tests here if applicable (e.g., pytest)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Start Containers
        run: docker compose up -d --build

      - name: Perform Healthcheck
        run: |
          curl --silent --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:4500/health

      - name: Clean up Containers
        if: always()
        run: docker compose down -v